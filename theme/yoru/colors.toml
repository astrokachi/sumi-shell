# Yoru 夜 — Tokyo after dark: station signage, kissaten light, rain
# on glass. A blue-black ground, cool steel text, eki cyan for focus,
# chōchin yellow, and the sign-pink kept for signals. Toned down from
# neon so it stays quiet.
